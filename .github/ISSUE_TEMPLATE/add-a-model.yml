name: "Add a model to the board"
description: "Paste a Hugging Face link. We do the port, the measurement, and the row."
title: "[row] "
labels: ["row request"]
body:
  - type: markdown
    attributes:
      value: |
        One link is enough. We port the model, run it through the same 596-item battery every
        row gets, gate it on a real iPhone, and add the row. We reply on this issue when the row
        lands, or with the reason it could not.

        What gets a row: open weights, and small enough for a phone (the board currently tops
        out around 4–5B parameters). Requests are batched into measurement runs, so the issue
        may stay open for a while; that is normal.
  - type: input
    id: model_url
    attributes:
      label: Model link
      description: The Hugging Face repo URL. A GitHub or vendor page works too.
      placeholder: "https://huggingface.co/LiquidAI/LFM2.5-1.2B"
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: What would you use it for? (optional)
      description: One line is plenty. It helps us choose which quantization to measure first.
      placeholder: "on-device summarizer inside a notes app; has to fit in about 2 GB"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Your device (optional)
      description: The phone or tablet you want to run it on.
      placeholder: "iPhone 16 / iPad M4 / Pixel 9"
    validations:
      required: false
